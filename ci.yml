name: Entec IDS Vector Engine CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build TypeScript
        run: npm run build

      - name: Run Sample Snapshot Parse Smoke Test
        run: node dist/cli.js parse --input samples/sample_snapshot.txt --output /tmp/sample_vectors.jsonl
